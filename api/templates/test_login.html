<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; max-width: 600px; }
        input, button { padding: 10px; margin: 8px 0; width: 100%; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; width: auto; }
        button:disabled { background: #ccc; }
        .section { border: 1px solid #ddd; padding: 15px; margin: 15px 0; border-radius: 8px; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .info { color: blue; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        .form-group { margin-bottom: 15px; }
        h2 { border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        .token-display { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 4px; word-break: break-all; font-size: 12px; }
    </style>
</head>
<body>

<div class="section">
    <h2>1. Register</h2>
    <div class="form-group">
        <label>Email:</label>
        <input type="email" id="registerEmail" placeholder="test@example.com" value="user@test.com">
    </div>
    <div class="form-group">
        <label>Full Name:</label>
        <input type="text" id="registerName" placeholder="tom" value="tom">
    </div>
    <div class="form-group">
        <label>Password:</label>
        <input type="password" id="registerPassword" placeholder="Password" value="testpass123">
    </div>
    <div class="form-group">
        <label>Confirm Password:</label>
        <input type="password" id="registerPassword2" placeholder="Confirm Password" value="testpass123">
    </div>
    <button onclick="registerUser()">Register</button>
    <div id="registerStatus" style="margin-top: 10px;"></div>
</div>

<div class="section">
    <h2>2. Login</h2>
    <div class="form-group">
        <label>Email:</label>
        <input type="email" id="loginEmail" placeholder="test@example.com" value="user@test.com">
    </div>
    <div class="form-group">
        <label>Password:</label>
        <input type="password" id="loginPassword" placeholder="Password" value="testpass123">
    </div>
    <button onclick="loginUser()">Login</button>
    <div id="loginStatus" style="margin-top: 10px;"></div>
    <div id="tokenDisplay" style="margin-top: 10px; display: none;">
        <h3>Tokens</h3>
        <label>Access Token:</label>
        <div class="token-display" id="accessTokenDisplay"></div>
        <label>Refresh Token:</label>
        <div class="token-display" id="refreshTokenDisplay"></div>
        <label>User Info:</label>
        <div class="token-display" id="userDisplay"></div>
    </div>
</div>

<script>
const BASE_URL = 'http://127.0.0.1:8000';

async function registerUser() {
    const email = document.getElementById('registerEmail').value;
    const full_name = document.getElementById('registerName').value;
    const password = document.getElementById('registerPassword').value;
    const password2 = document.getElementById('registerPassword2').value;

    if (!email || !password || !password2) return alert("Fill all fields");

    const status = document.getElementById('registerStatus');
    status.textContent = 'Registering...';
    status.className = 'info';

    try {
        const res = await fetch(`${BASE_URL}/prototype/auth/register/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, password2 })
        });

        const data = await res.json();
        if (res.ok) {
            localStorage.setItem('accessToken', data.access);
            localStorage.setItem('refreshToken', data.refresh);
            localStorage.setItem('user', JSON.stringify(data.user));
            status.innerHTML = `<span class="success">✅ Registration successful! Tokens saved.</span>`;
        } else {
            status.innerHTML = `<span class="error">❌ Registration failed: ${JSON.stringify(data)}</span>`;
        }
    } catch (e) {
        status.innerHTML = `<span class="error">❌ Error: ${e.message}</span>`;
    }
}

async function loginUser() {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;

    if (!email || !password) return alert("Fill all fields");

    const status = document.getElementById('loginStatus');
    status.textContent = 'Logging in...';
    status.className = 'info';

    try {
        const res = await fetch(`${BASE_URL}/prototype/auth/login/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (res.ok) {
            localStorage.setItem('accessToken', data.access);
            localStorage.setItem('refreshToken', data.refresh);
            localStorage.setItem('user', JSON.stringify(data.user));

            document.getElementById('accessTokenDisplay').textContent = data.access;
            document.getElementById('refreshTokenDisplay').textContent = data.refresh;
            document.getElementById('userDisplay').textContent = JSON.stringify(data.user, null, 2);
            document.getElementById('tokenDisplay').style.display = 'block';

            status.innerHTML = `<span class="success">✅ Login successful! Tokens saved to localStorage.</span>`;
        } else {
            status.innerHTML = `<span class="error">❌ Login failed: ${JSON.stringify(data)}</span>`;
        }
    } catch (e) {
        status.innerHTML = `<span class="error">❌ Error: ${e.message}</span>`;
    }
}
</script>
</body>
</html>
