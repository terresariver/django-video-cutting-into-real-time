<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Logout</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; max-width: 600px; }
        input, button { padding: 10px; margin: 8px 0; width: 100%; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; width: auto; }
        button:disabled { background: #ccc; }
        .section { border: 1px solid #ddd; padding: 15px; margin: 15px 0; border-radius: 8px; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .info { color: blue; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        .form-group { margin-bottom: 15px; }
        h2 { border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        .token-display { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 4px; word-break: break-all; font-size: 12px; }
    </style>
</head>
<body>

<div class="section">
    <h2>User Status</h2>
    <div id="userStatus" style="margin: 10px 0;"></div>
    <button onclick="displayTokens()">Display Tokens</button>
    <div id="tokenDisplay" style="margin-top: 10px; display: none;">
        <h3>Current Tokens</h3>
        <label>Access Token:</label>
        <div class="token-display" id="accessTokenDisplay"></div>
        <label>Refresh Token:</label>
        <div class="token-display" id="refreshTokenDisplay"></div>
        <label>User Info:</label>
        <div class="token-display" id="userDisplay"></div>
    </div>
</div>

<div class="section">
    <h2>Logout</h2>
    <p>Click the button below to logout. Your tokens will be blacklisted and removed from localStorage.</p>
    <button onclick="logoutUser()">Logout</button>
    <div id="logoutStatus" style="margin-top: 10px;"></div>
</div>

<script>
const BASE_URL = 'http://127.0.0.1:8000';

function checkUserStatus() {
    const accessToken = localStorage.getItem('accessToken');
    const user = localStorage.getItem('user');
    const status = document.getElementById('userStatus');

    if (accessToken && user) {
        const userData = JSON.parse(user);
        status.innerHTML = `<span class="success">✅ User logged in: <strong>${userData.email}</strong></span>`;
        return true;
    } else {
        status.innerHTML = `<span class="error">❌ No user logged in</span>`;
        return false;
    }
}

function displayTokens() {
    const accessToken = localStorage.getItem('accessToken');
    const refreshToken = localStorage.getItem('refreshToken');
    const user = localStorage.getItem('user');

    if (!accessToken) {
        alert('No tokens found. Please login first.');
        return;
    }

    document.getElementById('accessTokenDisplay').textContent = accessToken;
    document.getElementById('refreshTokenDisplay').textContent = refreshToken || 'Not found';
    document.getElementById('userDisplay').textContent = user ? JSON.stringify(JSON.parse(user), null, 2) : 'Not found';
    document.getElementById('tokenDisplay').style.display = 'block';
}

async function logoutUser() {
    const refreshToken = localStorage.getItem('refreshToken');

    if (!refreshToken) {
        alert('No refresh token found. Please login first.');
        return;
    }

    const status = document.getElementById('logoutStatus');
    status.textContent = 'Logging out...';
    status.className = 'info';

    try {
        const res = await fetch(`${BASE_URL}/prototype/auth/logout/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('accessToken')}`
            },
            body: JSON.stringify({ refresh: refreshToken })
        });

        const data = await res.json();
        if (res.ok) {
            localStorage.removeItem('accessToken');
            localStorage.removeItem('refreshToken');
            localStorage.removeItem('user');

            status.innerHTML = `<span class="success">✅ Logout successful! Tokens cleared.</span>`;
            document.getElementById('userStatus').innerHTML = `<span class="error">❌ No user logged in</span>`;
            document.getElementById('tokenDisplay').style.display = 'none';
        } else {
            status.innerHTML = `<span class="error">❌ Logout failed: ${JSON.stringify(data)}</span>`;
        }
    } catch (e) {
        status.innerHTML = `<span class="error">❌ Error: ${e.message}</span>`;
    }
}

window.addEventListener('load', checkUserStatus);
</script>
</body>
</html>
